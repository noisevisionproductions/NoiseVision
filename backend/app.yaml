runtime: custom
env: flex

service: backend-service

env_variables:
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=85.0"
  SERVER_PORT: "8080"

liveness_check:
  path: "/actuator/health"
  check_interval_sec: 30
  timeout_sec: 4
  failure_threshold: 2
  success_threshold: 2

readiness_check:
  path: "/actuator/health"
  check_interval_sec: 30
  timeout_sec: 4
  failure_threshold: 2
  success_threshold: 2

resources:
  cpu: 2
  memory_gb: 4
  disk_size_gb: 20

network:
  session_affinity: true

manual_scaling:
  instances: 1